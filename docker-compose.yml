# Local stack: docker compose up --build   →   http://localhost:8080
# Secrets come from .env (create it with `npm run setup:env`). Nothing secret lives here.
name: security-health-check

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-node-env: &node-env
  NODE_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?run npm run setup:env}:${POSTGRES_PASSWORD:?run npm run setup:env}@postgres:5432/${POSTGRES_DB:-shc}
  REDIS_URL: redis://:${REDIS_PASSWORD:?run npm run setup:env}@redis:6379/0
  WEB_BASE_URL: http://localhost:${WEB_HOST_PORT:-8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  MAIL_TRANSPORT: console
  # Development only (refused when APP_ENV=production): lets the scanner reach the local
  # test WordPress, which lives on a private Docker address.
  SCAN_ALLOW_PRIVATE_HOSTS: ${SCAN_ALLOW_PRIVATE_HOSTS:-wordpress.test}
  SCAN_COOLDOWN_MINUTES: ${SCAN_COOLDOWN_MINUTES:-15}
  SCAN_MAX_REQUESTS: ${SCAN_MAX_REQUESTS:-150}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey: the BSD-licensed, protocol-compatible fork of Redis. BullMQ and ioredis support it.
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: shc-api:local
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        APP: api
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment:
      <<: *node-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: *hardening

  api:
    image: shc-api:local
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        APP: api
    restart: unless-stopped
    environment:
      <<: *node-env
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      # Exactly one proxy (nginx) sits in front. The API port is not published to the host.
      TRUST_PROXY_HOPS: "1"
      PDF_SERVICE_URL: http://pdf:3000
      # Instant, free plan changes for development. Refused when APP_ENV=production.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-stub}
      # Only the API signs and checks companion-plugin keys.
      PLUGIN_KEY_SECRET: ${PLUGIN_KEY_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pdf:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *hardening

  worker:
    image: shc-worker:local
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        APP: worker
    restart: unless-stopped
    environment:
      <<: *node-env
      # Only the worker gets the intel API keys (least privilege).
      WORDFENCE_API_KEY: ${WORDFENCE_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      INTEL_REFRESH_CRON: ${INTEL_REFRESH_CRON:-17 3 * * *}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    <<: *hardening

  # HTML-to-PDF with headless Chromium (Gotenberg, MIT). Internal only: no published port.
  # JavaScript is off and Chromium may only load the files Gotenberg writes to /tmp, so
  # report content can't make it fetch anything.
  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --api-timeout=45s
      - --log-level=warn
    security_opt:
      - no-new-privileges:true

  web:
    image: shc-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---- Local test WordPress (end-to-end scans) ---------------------------------------
  # docker compose --profile testwp up -d
  # Deliberately outdated: WordPress 6.4.2 with Contact Form 7 5.3.1 (CVE-2020-35489).
  # Reachable by the scanner as http://wordpress.test inside the Docker network and by
  # you at http://127.0.0.1:8081 (requests there must send "Host: wordpress.test").
  testwp-db:
    profiles: ["testwp"]
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${TESTWP_DB_PASSWORD:?run npm run setup:env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - testwp-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  testwp:
    profiles: ["testwp"]
    image: wordpress:6.4.2-php8.1-apache
    restart: unless-stopped
    environment: &testwp-env
      WORDPRESS_DB_HOST: testwp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${TESTWP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      # Must stay outdated: no background updates (they would also race the setup step).
      WORDPRESS_CONFIG_EXTRA: |
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISABLE_WP_CRON', true);
        define('SHC_COMPANION_SERVICE', 'http://web:8080');
        define('SHC_COMPANION_ALLOW_HTTP', true);
    volumes:
      - testwp-html:/var/www/html
      - ./plugin/shc-companion:/var/www/html/wp-content/plugins/shc-companion:ro
    ports:
      - "127.0.0.1:${TESTWP_HOST_PORT:-8081}:80"
    networks:
      default:
        aliases:
          - wordpress.test
          - www.wordpress.test
    depends_on:
      testwp-db:
        condition: service_healthy

  testwp-setup:
    profiles: ["testwp"]
    image: wordpress:cli-php8.1
    user: "33:33"
    environment:
      <<: *testwp-env
      TESTWP_ADMIN_PASSWORD: ${TESTWP_ADMIN_PASSWORD:?run npm run setup:env}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - testwp-html:/var/www/html
      - ./plugin/shc-companion:/var/www/html/wp-content/plugins/shc-companion:ro
      - ./docker/testwp/setup.sh:/setup.sh:ro
    entrypoint: ["sh", "/setup.sh"]
    depends_on:
      testwp:
        condition: service_started
      testwp-db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  redisdata:
  testwp-db:
  testwp-html:
